<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>codebase scan</title>
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: dark;
  --bg:        #0b0d11;
  --bg-panel:  #111419;
  --bg-node:   #161a21;
  --bg-hover:  #1c212a;
  --bg-inset:  #0e1116;
  --fg:        #e8ecf2;
  --fg-muted:  #8b95a5;
  --fg-faint:  #5b6472;
  --border:    #232936;
  --border-strong: #333c4d;
  --edge:      #39414f;
  --edge-hot:  #cfd8e6;
  --shadow:    0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.32);
  --shadow-sel: 0 0 0 1px var(--accent), 0 6px 28px rgba(0,0,0,.5);

  --k-entry:    #38bdf8;
  --k-cron:     #fbbf24;
  --k-agent:    #a78bfa;
  --k-model:    #f472b6;
  --k-tool:     #34d399;
  --k-service:  #8296b3;
  --k-store:    #fb923c;
  --k-external: #94a3b8;
}

:root[data-theme="light"], html:not([data-theme="dark"]) {
  /* placeholder — real light values live in the two blocks below */
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:        #f6f7f9;
    --bg-panel:  #ffffff;
    --bg-node:   #ffffff;
    --bg-hover:  #f2f4f7;
    --bg-inset:  #f0f2f5;
    --fg:        #10141b;
    --fg-muted:  #5c6673;
    --fg-faint:  #8b95a3;
    --border:    #e0e4ea;
    --border-strong: #c4ccd6;
    --edge:      #c3cbd6;
    --edge-hot:  #2b3444;
    --shadow:    0 1px 2px rgba(16,20,27,.06), 0 6px 20px rgba(16,20,27,.07);
    --shadow-sel: 0 0 0 1px var(--accent), 0 8px 26px rgba(16,20,27,.14);

    --k-entry:    #0284c7;
    --k-cron:     #b45309;
    --k-agent:    #7c3aed;
    --k-model:    #be1e63;
    --k-tool:     #047857;
    --k-service:  #4a5c78;
    --k-store:    #c2410c;
    --k-external: #566371;
  }
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg:        #f6f7f9;
  --bg-panel:  #ffffff;
  --bg-node:   #ffffff;
  --bg-hover:  #f2f4f7;
  --bg-inset:  #f0f2f5;
  --fg:        #10141b;
  --fg-muted:  #5c6673;
  --fg-faint:  #8b95a3;
  --border:    #e0e4ea;
  --border-strong: #c4ccd6;
  --edge:      #c3cbd6;
  --edge-hot:  #2b3444;
  --shadow:    0 1px 2px rgba(16,20,27,.06), 0 6px 20px rgba(16,20,27,.07);
  --shadow-sel: 0 0 0 1px var(--accent), 0 8px 26px rgba(16,20,27,.14);

  --k-entry:    #0284c7;
  --k-cron:     #b45309;
  --k-agent:    #7c3aed;
  --k-model:    #be1e63;
  --k-tool:     #047857;
  --k-service:  #4a5c78;
  --k-store:    #c2410c;
  --k-external: #566371;
}

html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

code, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }

/* ----- header ------------------------------------------------------------ */

header {
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
  flex-wrap: wrap;
}

.brand { display: flex; flex-direction: column; gap: 1px; margin-right: 4px; }
.brand h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
.brand .tagline { font-size: 11.5px; color: var(--fg-muted); }

.stats { display: flex; gap: 6px; flex-wrap: wrap; }

.stat {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 3px 9px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-inset);
  font-size: 11.5px;
  color: var(--fg-muted);
  white-space: nowrap;
}
.stat b { color: var(--fg); font-weight: 620; font-size: 12px; }

.spacer { flex: 1 1 auto; }

.tools { display: flex; align-items: center; gap: 8px; }

input[type="search"] {
  width: 210px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-inset);
  color: var(--fg);
  font: inherit;
  font-size: 12.5px;
}
input[type="search"]:focus {
  outline: none;
  border-color: var(--border-strong);
  box-shadow: 0 0 0 3px rgba(130,150,179,.14);
}
input[type="search"]::placeholder { color: var(--fg-faint); }

button {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-inset);
  color: var(--fg-muted);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
button:hover { background: var(--bg-hover); color: var(--fg); }
button:focus-visible { outline: 2px solid var(--k-entry); outline-offset: 1px; }

/* ----- chip rows (topModels / topTools / topIntegrations) ----------------- */

.chiprows {
  flex: none;
  display: flex;
  gap: 18px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
  flex-wrap: wrap;
  font-size: 12px;
}
.chiprow { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.chiprow > .label {
  color: var(--fg-faint);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .07em;
  font-weight: 600;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px 3px 4px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-inset);
}
.chip .mono-dot {
  width: 17px; height: 17px;
  border-radius: 5px;
  display: grid; place-items: center;
  font-size: 9.5px; font-weight: 700;
  background: var(--bg-hover);
  color: var(--fg-muted);
}
.chip .host { color: var(--fg-faint); font-size: 10.5px; }

/* ----- stage ------------------------------------------------------------- */

main { flex: 1 1 auto; display: flex; min-height: 0; }

#stage {
  position: relative;
  flex: 1 1 auto;
  overflow: hidden;
  cursor: grab;
  background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
  background-size: 26px 26px;
}
#stage.panning { cursor: grabbing; }
#stage.traced .node:not(.hot) { opacity: .22; }
#stage.traced .grouplabel { opacity: .3; }

#canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
#wires { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

/* ----- edges ------------------------------------------------------------- */

.wire { fill: none; stroke: var(--edge); stroke-width: 1.4px; }
.wire.hot { stroke: var(--edge-hot); stroke-width: 2px; }
.wire.dim { opacity: .16; }

.wirelabel {
  font-size: 10px;
  fill: var(--fg-muted);
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 4px;
  stroke-linejoin: round;
  text-anchor: middle;
}
.wirelabel.verb { fill: var(--fg-faint); opacity: 0; transition: opacity .12s; }
#stage.traced .wirelabel.verb.hot { opacity: 1; }
.wirelabel.dim { opacity: .16; }

/* ----- nodes ------------------------------------------------------------- */

.grouplabel {
  position: absolute;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg-faint);
  white-space: nowrap;
  pointer-events: none;
}

.node {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--kind);
  border-radius: 9px;
  background: var(--bg-node);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: opacity .12s, transform .12s, box-shadow .12s;
  --accent: var(--kind);
}
.node:hover { background: var(--bg-hover); transform: translateY(-1px); }
.node.selected { box-shadow: var(--shadow-sel); background: var(--bg-hover); }
.node.k-external { border-style: dashed; border-left-style: solid; }

.node.searchhide { opacity: .1; pointer-events: none; }
.node .glyph { flex: none; color: var(--kind); display: grid; place-items: center; }
.node .glyph svg { display: block; }

.node .text { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; }
.node .label {
  font-size: 12.5px;
  font-weight: 580;
  letter-spacing: -0.005em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.node .sub {
  font-size: 10.5px;
  color: var(--fg-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* ----- detail panel ------------------------------------------------------ */

aside {
  flex: none;
  width: 320px;
  border-left: 1px solid var(--border);
  background: var(--bg-panel);
  overflow-y: auto;
  padding: 16px;
}
aside .empty { color: var(--fg-faint); font-size: 12.5px; line-height: 1.65; }
aside h2 {
  margin: 0 0 2px;
  font-size: 15px;
  font-weight: 640;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
aside .kindtag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 660; text-transform: uppercase; letter-spacing: .07em;
  color: var(--kind);
  margin-bottom: 12px;
}
aside .detail-text { font-size: 12.5px; line-height: 1.6; color: var(--fg); margin: 0 0 14px; }
aside .ref {
  display: block;
  font-size: 11.5px;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-inset);
  color: var(--fg-muted);
  overflow-wrap: anywhere;
  margin-bottom: 14px;
  user-select: all;
}
aside h3 {
  margin: 0 0 6px;
  font-size: 10px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
  color: var(--fg-faint);
}
aside ul { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 3px; }
aside li button {
  width: 100%;
  text-align: left;
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 5px 8px;
  font-size: 12px;
  color: var(--fg);
  background: transparent;
  border-color: transparent;
}
aside li button:hover { background: var(--bg-hover); border-color: var(--border); }
aside li .verb {
  flex: none;
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--fg-faint);
  min-width: 46px;
}
aside li .edgenote { color: var(--fg-muted); font-size: 11px; }

/* ----- legend + banner --------------------------------------------------- */

.legend {
  position: absolute;
  left: 14px; bottom: 14px;
  display: flex; gap: 4px; flex-wrap: wrap;
  max-width: calc(100% - 28px);
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: color-mix(in srgb, var(--bg-panel) 88%, transparent);
  backdrop-filter: blur(8px);
}
.legend .item {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px 2px 5px;
  border-radius: 6px;
  font-size: 10.5px;
  color: var(--fg-muted);
  cursor: pointer;
  user-select: none;
  --accent: var(--kind);
}
.legend .item:hover { background: var(--bg-hover); color: var(--fg); }
.legend .item.off { opacity: .34; }
.legend .item .dot { width: 8px; height: 8px; border-radius: 3px; background: var(--kind); }

.banner {
  position: absolute;
  left: 50%; top: 14px;
  transform: translateX(-50%);
  max-width: min(560px, calc(100% - 28px));
  padding: 9px 13px;
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
  font-size: 12px;
  color: var(--fg-muted);
  line-height: 1.55;
}
.banner b { color: var(--fg); font-weight: 620; }
.banner code {
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg-inset);
  color: var(--fg);
}

/* ----- evidence (solid = EXTRACTED, dashed = INFERRED) -------------------- */

/* The class is only ever minted from the closed alphabet in `tiers.py`
   (`safeEvidence`); a scan without the field renders exactly as before. */
.node.ev-inferred { border-style: dashed; border-left-style: solid; }

/* ----- tier 2: community overview ----------------------------------------- */

#comm-wires {
  position: absolute;
  top: 0; left: 0;
  overflow: visible;
  pointer-events: none;
  display: none;
}
.node.commnode { display: none; }
#stage.mode-communities .node:not(.commnode) { display: none; }
#stage.mode-communities .grouplabel { display: none; }
#stage.mode-communities #wires { display: none; }
#stage.mode-communities .node.commnode { display: flex; }
#stage.mode-communities #comm-wires { display: block; }

aside li.member {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 8px;
  font-size: 12px;
}
aside li.member .ref {
  display: inline;
  margin: 0;
  padding: 1px 6px;
  font-size: 10.5px;
}

/* ----- tier 3: focus + expand --------------------------------------------- */

.ghost {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 9px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: color-mix(in srgb, var(--bg-node) 92%, transparent);
  box-shadow: var(--shadow);
  font-size: 10.5px;
  z-index: 3;
  pointer-events: none;
}
.ghost .rel {
  flex: none;
  color: var(--fg-faint);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.ghost .gtext { min-width: 0; display: flex; flex-direction: column; }
.ghost .glabel {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ghost .gpath {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--fg-muted);
  font-size: 9.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ghostwire { stroke-dasharray: 4 3; }

.hidden { display: none !important; }

@media (max-width: 860px) {
  aside { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; box-shadow: var(--shadow); }
  aside.empty-state { display: none; }
  input[type="search"] { width: 130px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 id="project-name">codebase scan</h1>
    <span class="tagline" id="project-tagline"></span>
  </div>
  <div class="stats" id="stats"></div>
  <span class="spacer"></span>
  <div class="tools">
    <input type="search" id="search" placeholder="filter nodes…" aria-label="Filter nodes" />
    <button id="fit" title="Fit to screen (F)">Fit</button>
    <button id="tiers" class="hidden" title="Toggle community overview (C)">Communities</button>
    <button id="theme" title="Toggle light / dark">Theme</button>

</header>
<div class="chiprows" id="chiprows"></div>

    <div class="legend" id="legend"></div>
    <div class="banner hidden" id="banner"></div>
  </div>
  <aside id="detail" class="empty-state"></aside>
</main>

<script>
const SCAN = JSON.parse(document.getElementById("scan-data").textContent);
const NODES = (SCAN.graph && SCAN.graph.nodes) || [];
const EDGES = (SCAN.graph && SCAN.graph.edges) || [];

/* Which column a kind lives in: trigger → logic → capability → data. */
const TIER = {
  entry: 0, cron: 0,
  agent: 1, service: 1,
  model: 2, tool: 2,
  store: 3, external: 3,
};
const KINDS = ["entry", "cron", "agent", "service", "model", "tool", "store", "external"];

const GLYPH = {
  entry:    '<path d="M1.5 6.5h6M5 4l2.5 2.5L5 9M10.5 1.5v10"/>',
  cron:     '<circle cx="6.5" cy="6.5" r="5"/><path d="M6.5 3.6v3.1l2.1 1.5"/>',
  agent:    '<path d="M6.5 1 7.9 5.1 12 6.5 7.9 7.9 6.5 12 5.1 7.9 1 6.5 5.1 5.1z" fill="currentColor" stroke="none"/>',
  service:  '<rect x="1.5" y="2" width="10" height="3.4" rx="1.2"/><rect x="1.5" y="7.6" width="10" height="3.4" rx="1.2"/>',
  model:    '<circle cx="6.5" cy="6.5" r="2.4"/><ellipse cx="6.5" cy="6.5" rx="5.6" ry="2.5" transform="rotate(-32 6.5 6.5)"/>',
  tool:     '<path d="M9.2 1.6a3.1 3.1 0 0 0-3.7 4.1L1.7 9.5a1.25 1.25 0 1 0 1.8 1.8l3.8-3.8a3.1 3.1 0 0 0 4.1-3.7L9.6 5.9 7.2 3.5z"/>',
  store:    '<ellipse cx="6.5" cy="3.1" rx="4.9" ry="1.8"/><path d="M1.6 3.1v6.8c0 1 2.2 1.8 4.9 1.8s4.9-.8 4.9-1.8V3.1"/>',
  external: '<path d="M7 2H2.6A1.6 1.6 0 0 0 1 3.6v6.8A1.6 1.6 0 0 0 2.6 12h6.8a1.6 1.6 0 0 0 1.6-1.6V6M8.2 1.2H12v3.8M12 1.2 6.6 6.6"/>',
};

/* `kind` is model-authored and lands in a class name, a CSS custom-property
   name, and a glyph lookup. Fold it onto the closed alphabet first: an
   unknown kind then renders as a plain `service` box instead of injecting
   into `style.cssText` or silently resolving `var(--k-…)` to nothing. */
const KIND_SET = new Set(KINDS);
const safeKind = k => (KIND_SET.has(k) ? k : "service");

function glyph(kind) {
  return '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" ' +
         'stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
         GLYPH[safeKind(kind)] + "</svg>";
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/* ----- geometry ----------------------------------------------------------- */

const NODE_W = 196, ROW_GAP = 13, GROUP_GAP = 30, GROUP_HEAD = 19, COL_GAP = 128, PAD = 60;
/* Above this many rows a tier wraps into another column. Without it the
   seed's worst case — every node the same kind, so every node in one tier —
   renders as a single 26-deep column with every edge looping around it. */
const MAX_COL_ROWS = 12;
const nodeH = n => (n.sub ? 46 : 36);

const byId = new Map(NODES.map(n => [n.id, n]));
const box = new Map();          // node id → {x, y, w, h}
const groupLabels = [];         // {name, x, y}

/* Group nodes within a tier, preserving the order the author wrote them in —
   that order is a deliberate signal and re-sorting would erase it. */
function stack(nodes) {
  const groups = new Map();
  const loose = [];
  for (const n of nodes) {
    if (n.group) {
      if (!groups.has(n.group)) groups.set(n.group, []);
      groups.get(n.group).push(n);
    } else loose.push(n);
  }
  const blocks = [...groups.entries()].map(([name, ns]) => ({ name, nodes: ns }));
  if (loose.length) blocks.push({ name: null, nodes: loose });
  return blocks;
}

/* Pack a tier's blocks into columns of at most MAX_COL_ROWS rows. A group is
   never split across columns — it would stop being one labelled stack — so a
   group larger than the limit simply gets a column to itself. */
function wrap(blocks) {
  /* Ungrouped nodes are a pile, not a stack — nothing is claimed about them
     sitting together, so they chunk freely. A named group is a claim, so it
     stays whole even if that overshoots the limit. */
  const units = [];
  for (const b of blocks) {
    if (b.name) { units.push(b); continue; }
    for (let i = 0; i < b.nodes.length; i += MAX_COL_ROWS) {
      units.push({ name: null, nodes: b.nodes.slice(i, i + MAX_COL_ROWS) });
    }
  }

  const columns = [];
  let current = [], rows = 0;
  for (const u of units) {
    if (current.length && rows + u.nodes.length > MAX_COL_ROWS) {
      columns.push(current);
      current = []; rows = 0;
    }
    current.push(u);
    rows += u.nodes.length;
  }
  if (current.length) columns.push(current);
  return columns;
}

/* A group is meant to read as one labelled stack, so the group owns the
   column, not the kind: an "Ingestion" group holding two agents and the
   index they write to stays together instead of being torn across three
   tiers. The group's first node in author order picks the column — author
   order is reading order, and it is the only signal that says which of a
   mixed group's kinds is the one the group is *about*. */
function columnOf(node, groupTier) {
  if (node.group && groupTier.has(node.group)) return groupTier.get(node.group);
  return TIER[node.kind] != null ? TIER[node.kind] : 1;
}

function layout() {
  const groupTier = new Map();
  for (const n of NODES) {
    if (n.group && !groupTier.has(n.group)) {
      groupTier.set(n.group, TIER[n.kind] != null ? TIER[n.kind] : 1);
    }
  }

  const cols = [[], [], [], []];
  for (const n of NODES) cols[columnOf(n, groupTier)].push(n);
  const active = cols.filter(c => c.length).flatMap(nodes => wrap(stack(nodes)));

  const measured = active.map(blocks => {
    let h = 0;
    for (const b of blocks) {
      if (b.name) h += GROUP_HEAD;
      for (const n of b.nodes) h += nodeH(n) + ROW_GAP;
      h += GROUP_GAP;
    }
    return { blocks, height: h - GROUP_GAP - ROW_GAP };
  });

  const tallest = Math.max(0, ...measured.map(c => c.height));
  measured.forEach((col, i) => {
    const x = i * (NODE_W + COL_GAP);
    let y = (tallest - col.height) / 2;
    for (const b of col.blocks) {
      if (b.name) { groupLabels.push({ name: b.name, x, y: y + 4 }); y += GROUP_HEAD; }
      for (const n of b.nodes) {
        box.set(n.id, { x, y, w: NODE_W, h: nodeH(n) });
        y += nodeH(n) + ROW_GAP;
      }
      y += GROUP_GAP;
    }
  });

  /* Shift everything positive so the canvas has no negative coordinates. */
  const xs = [...box.values()];
  const minY = Math.min(0, ...xs.map(b => b.y), ...groupLabels.map(g => g.y));
  for (const b of box.values()) { b.x += PAD; b.y += PAD - minY; }
  for (const g of groupLabels) { g.x += PAD; g.y += PAD - minY; }

  return {
    w: Math.max(...xs.map(b => b.x + b.w), 0) + PAD,
    h: Math.max(...xs.map(b => b.y + b.h), 0) + PAD,
  };
}

/* A wire leaves the right edge and enters the left edge. Back-edges reverse
   that; same-column edges bulge out to the right so they don't cut through
   the nodes stacked between them. */
function wirePath(a, b) {
  const ay = a.y + a.h / 2, by = b.y + b.h / 2;
  if (Math.abs(a.x - b.x) < 1) {
    const x1 = a.x + a.w, x2 = b.x + b.w, d = 34 + Math.abs(by - ay) * 0.34;
    return `M${x1},${ay} C${x1 + d},${ay} ${x2 + d},${by} ${x2},${by}`;
  }
  const fwd = b.x > a.x;
  const x1 = fwd ? a.x + a.w : a.x;
  const x2 = fwd ? b.x : b.x + b.w;
  const d = Math.max(38, Math.abs(x2 - x1) * 0.45) * (fwd ? 1 : -1);
  return `M${x1},${ay} C${x1 + d},${ay} ${x2 - d},${by} ${x2},${by}`;
}

/* ----- render ------------------------------------------------------------- */

const stage = document.getElementById("stage");
const canvas = document.getElementById("canvas");
const wires = document.getElementById("wires");
const aside = document.getElementById("detail");
const SVGNS = "http://www.w3.org/2000/svg";

const size = layout();
/* What `fit()` fits to. Tier 1's extent by default; the community overview
   (tiers.py) swaps its own extent in when that mode is active. */
const view = { w: size.w, h: size.h };
canvas.style.width = size.w + "px";
canvas.style.height = size.h + "px";
wires.setAttribute("width", size.w);
wires.setAttribute("height", size.h);
wires.setAttribute("viewBox", `0 0 ${size.w} ${size.h}`);

for (const g of groupLabels) {
  const el = document.createElement("div");
  el.className = "grouplabel";
  el.textContent = g.name;
  el.style.left = g.x + "px";
  el.style.top = g.y + "px";
  canvas.appendChild(el);
}

/* Declared before the first click listener binds: top-level order is
   execution order, so a `let` below the binding would leave every click
   dying in the temporal dead zone if anything later in init throws — a
   rendered map that ignores all clicks. */
let selected = null;

const nodeEls = new Map();
for (const n of NODES) {
  const b = box.get(n.id);
  const el = document.createElement("div");
  const kind = safeKind(n.kind);
  el.className = `node k-${kind}`;
  el.style.cssText =
    `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;--kind:var(--k-${kind})`;
  el.dataset.id = n.id;
  el.innerHTML =
    `<span class="glyph">${glyph(n.kind)}</span><span class="text">` +
    `<span class="label">${esc(n.label)}</span>` +
    (n.sub ? `<span class="sub">${esc(n.sub)}</span>` : "") +
    "</span>";
  el.addEventListener("click", ev => { ev.stopPropagation(); select(n.id); });
  canvas.appendChild(el);
  nodeEls.set(n.id, el);
}

/* Only edges whose endpoints both exist get drawn. `scan-check` rejects a
   dangling edge, but a viewer that throws on one is a viewer that shows
   nothing when the map is 95% fine. */
const wireEls = [];
EDGES.forEach((e, i) => {
  const a = box.get(e.from), b = box.get(e.to);
  if (!a || !b) return;
  const path = document.createElementNS(SVGNS, "path");
  path.setAttribute("class", "wire");
  path.setAttribute("d", wirePath(a, b));
  wires.appendChild(path);

  let label = null;
  const text = e.label || e.kind;
  if (text) {
    /* Curve geometry is decoration and engines disagree about it: Firefox
       throws for paths it has not rendered and jsdom has no implementation
       at all. This runs mid-init, so trusting it turns a cosmetic failure
       into a dead viewer. Prefer the true curve midpoint, fall back to the
       straight-line midpoint of the endpoint boxes. */
    let mid = { x: (a.x + a.w / 2 + b.x + b.w / 2) / 2,
                y: (a.y + a.h / 2 + b.y + b.h / 2) / 2 };
    try {
      const len = path.getTotalLength();
      mid = path.getPointAtLength(len / 2);
    } catch { /* box midpoint stands */ }
    label = document.createElementNS(SVGNS, "text");
    label.setAttribute("class", "wirelabel" + (e.label ? "" : " verb"));
    label.setAttribute("x", mid.x);
    label.setAttribute("y", mid.y - 4);
    label.textContent = text;
    wires.appendChild(label);
  }
  wireEls.push({ edge: e, index: i, path, label });
});

/* ----- pan + zoom --------------------------------------------------------- */

let tx = 0, ty = 0, k = 1;
/* Set the moment the reader pans or zooms. After that the viewport is
   theirs: a window resize re-fits a map nobody has touched, but it must
   not throw away the corner someone deliberately navigated to. */
let userMoved = false;
const apply = () => { canvas.style.transform = `translate(${tx}px,${ty}px) scale(${k})`; };

function fit() {
  const r = stage.getBoundingClientRect();
  /* The banner floats over the top of the stage, so when it is showing the
     map has to be fitted into what is left underneath it. */
  const top = banner && !banner.classList.contains("hidden")
    ? banner.getBoundingClientRect().height + 24
    : 0;
  const usable = Math.max(120, r.height - top);
  k = Math.min(1, (r.width - 24) / view.w, (usable - 24) / view.h) || 1;
  k = Math.max(k, 0.2);
  tx = (r.width - view.w * k) / 2;
  ty = top + (usable - view.h * k) / 2;
  apply();
}

stage.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const next = Math.min(2.6, Math.max(0.18, k * Math.exp(-ev.deltaY * 0.0016)));
  userMoved = true;
  tx = px - (px - tx) * (next / k);
  ty = py - (py - ty) * (next / k);
  k = next;
  apply();
}, { passive: false });

let drag = null;
stage.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  drag = { x: ev.clientX - tx, y: ev.clientY - ty,
           sx: ev.clientX, sy: ev.clientY, id: ev.pointerId, moved: false };
});
stage.addEventListener("pointermove", ev => {
  if (!drag) return;
  /* Capturing on pointerdown retargets the pointerup — and the derived
     compatibility `click` — to the stage, so node click listeners would
     never fire: every click on a box would silently deselect instead.
     Capture only once movement crosses the jitter threshold, i.e. the
     moment this press stops being a click and becomes a pan. */
  if (!drag.moved) {
    if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 4) return;
    drag.moved = true;
    stage.classList.add("panning");
    stage.setPointerCapture(drag.id);
  }
  tx = ev.clientX - drag.x; ty = ev.clientY - drag.y;
  userMoved = true;
  apply();
});
stage.addEventListener("pointerup", ev => {
  const wasDrag = drag && drag.moved;
  drag = null;
  stage.classList.remove("panning");
  if (!wasDrag) select(null);
});

/* ----- selection + trace -------------------------------------------------- */

function reachable(startId) {
  const nodesHot = new Set([startId]);
  const edgesHot = new Set();
  for (const dir of ["out", "in"]) {
    const queue = [startId];
    const seen = new Set([startId]);
    while (queue.length) {
      const cur = queue.shift();
      wireEls.forEach(w => {
        const near = dir === "out" ? w.edge.from : w.edge.to;
        const far = dir === "out" ? w.edge.to : w.edge.from;
        if (near !== cur || seen.has(far)) return;
        seen.add(far);
        nodesHot.add(far);
        edgesHot.add(w.index);
        queue.push(far);
      });
      /* Edges into/out of `cur` that loop back to an already-seen node still
         belong to the trace — otherwise a cycle renders with a gap in it. */
      wireEls.forEach(w => {
        if ((dir === "out" ? w.edge.from : w.edge.to) === cur) edgesHot.add(w.index);
      });
    }
  }
  return { nodesHot, edgesHot };
}

function select(id) {
  selected = id && byId.has(id) ? id : null;
  for (const [nid, el] of nodeEls) el.classList.toggle("selected", nid === selected);

  if (!selected) {
    stage.classList.remove("traced");
    nodeEls.forEach(el => el.classList.remove("hot"));
    wireEls.forEach(w => {
      w.path.classList.remove("hot", "dim");
      if (w.label) w.label.classList.remove("hot", "dim");
    });
    renderEmptyPanel();
    return;
  }

  const { nodesHot, edgesHot } = reachable(selected);
  stage.classList.add("traced");
  nodeEls.forEach((el, nid) => el.classList.toggle("hot", nodesHot.has(nid)));
  wireEls.forEach(w => {
    const hot = edgesHot.has(w.index);
    w.path.classList.toggle("hot", hot);
    w.path.classList.toggle("dim", !hot);
    if (w.label) {
      w.label.classList.toggle("hot", hot);
      w.label.classList.toggle("dim", !hot);
    }
  });
  renderPanel(byId.get(selected));
}

function renderEmptyPanel() {
  aside.classList.add("empty-state");
  aside.innerHTML =
    '<p class="empty">Click a node to trace what it reaches and what reaches it.' +
    "<br><br>Drag to pan, scroll to zoom, <b>F</b> to fit, <b>/</b> to search, " +
    "<b>Esc</b> to clear.</p>";
}

function connections(id) {
  const out = [], inc = [];
  for (const w of wireEls) {
    if (w.edge.from === id) out.push({ other: w.edge.to, edge: w.edge });
    if (w.edge.to === id) inc.push({ other: w.edge.from, edge: w.edge });
  }
  return { out, inc };
}

function connList(title, items, verbOf) {
  if (!items.length) return "";
  const rows = items.map(it => {
    const other = byId.get(it.other);
    return '<li><button data-goto="' + esc(it.other) + '">' +
      '<span class="verb">' + esc(verbOf(it.edge)) + "</span>" +
      "<span>" + esc(other ? other.label : it.other) +
      (it.edge.label ? ' <span class="edgenote">— ' + esc(it.edge.label) + "</span>" : "") +
      "</span></button></li>";
  }).join("");
  return "<h3>" + title + "</h3><ul>" + rows + "</ul>";
}

function renderPanel(n) {
  const { out, inc } = connections(n.id);
  aside.classList.remove("empty-state");
  aside.innerHTML =
    '<div style="--kind:var(--k-' + safeKind(n.kind) + ')">' +
    "<h2>" + esc(n.label) + "</h2>" +
    '<div class="kindtag">' + glyph(n.kind) + esc(n.kind) +
      (n.group ? " · " + esc(n.group) : "") +
      (n.evidence ? " · " + esc(n.evidence) : "") + "</div>" +
    (n.sub ? '<p class="detail-text mono">' + esc(n.sub) + "</p>" : "") +
    (n.detail ? '<p class="detail-text">' + esc(n.detail) + "</p>" : "") +
    (n.sourceRef ? '<code class="ref">' + esc(n.sourceRef) + "</code>" : "") +
    (n.domain ? '<code class="ref">' + esc(n.domain) + "</code>" : "") +
    connList("Reaches", out, e => e.kind || "→") +
    connList("Reached by", inc, e => e.kind || "←") +
    "</div>";
  aside.querySelectorAll("[data-goto]").forEach(b =>
    b.addEventListener("click", () => select(b.dataset.goto)));
}

/* ----- search + legend ---------------------------------------------------- */

const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  nodeEls.forEach((el, id) => {
    if (!q) return el.classList.remove("searchhide");
    const n = byId.get(id);
    const hay = [n.label, n.sub, n.detail, n.sourceRef, n.domain, n.group, n.kind]
      .filter(Boolean).join(" ").toLowerCase();
    el.classList.toggle("searchhide", !hay.includes(q));
  });
});

const hiddenKinds = new Set();
function applyKinds() {
  nodeEls.forEach((el, id) => {
    el.classList.toggle("hidden", hiddenKinds.has(byId.get(id).kind));
  });
  wireEls.forEach(w => {
    const a = byId.get(w.edge.from), b = byId.get(w.edge.to);
    const off = (a && hiddenKinds.has(a.kind)) || (b && hiddenKinds.has(b.kind));
    w.path.classList.toggle("hidden", off);
    if (w.label) w.label.classList.toggle("hidden", off);
  });
}

const legend = document.getElementById("legend");
const present = KINDS.filter(kind => NODES.some(n => n.kind === kind));
legend.innerHTML = present.map(kind =>
  '<span class="item" data-kind="' + kind + '" style="--kind:var(--k-' + kind + ')">' +
  '<span class="dot"></span>' + kind + "</span>").join("");
legend.querySelectorAll("[data-kind]").forEach(el => {
  el.addEventListener("click", () => {
    const kind = el.dataset.kind;
    hiddenKinds.has(kind) ? hiddenKinds.delete(kind) : hiddenKinds.add(kind);
    el.classList.toggle("off", hiddenKinds.has(kind));
    applyKinds();
  });
});

/* ----- header ------------------------------------------------------------- */

function monogram(text) {
  const words = String(text || "?").trim().split(/[\s\-_/.]+/).filter(Boolean);
  const pair = words.length > 1 ? words[0][0] + words[1][0] : String(text || "?").slice(0, 2);
  return pair.toUpperCase();
}

const project = SCAN.project || {};
if (project.name) {
  document.getElementById("project-name").textContent = project.name;
  document.title = project.name + " · codebase scan";
}
document.getElementById("project-tagline").textContent =
  [project.tagline, project.date].filter(Boolean).join(" · ");

const stats = SCAN.stats || {};
document.getElementById("stats").innerHTML = [
  ["agents", stats.agents], ["models", stats.models],
  ["tools", stats.tools], ["integrations", stats.integrations],
].filter(([, v]) => v)
 .concat([["nodes", NODES.length], ["edges", EDGES.length]])
 .map(([label, v]) => `<span class="stat"><b>${esc(v)}</b>${label}</span>`)
 .join("");

const chiprows = document.getElementById("chiprows");
const rowsHtml = [["topModels", "models"], ["topTools", "tools"], ["topIntegrations", "integrations"]]
  .map(([key, label]) => {
    const items = SCAN[key] || [];
    if (!items.length) return "";
    return '<div class="chiprow"><span class="label">' + label + "</span>" +
      items.map(c =>
        '<span class="chip"><span class="mono-dot">' + esc(monogram(c.label)) + "</span>" +
        esc(c.label) +
        (c.domain ? '<span class="host">' + esc(c.domain) + "</span>" : "") +
        "</span>").join("") +
      "</div>";
  }).join("");
if (rowsHtml) chiprows.innerHTML = rowsHtml; else chiprows.classList.add("hidden");

/* The seed is a real map, but it is a map of shape, not of meaning. Say so
   rather than letting someone mistake `12 files · 3 flows` for a summary. */
const banner = document.getElementById("banner");
if (!NODES.length) {
  banner.innerHTML =
    "<b>No scan yet.</b> Run <code>dummyindex ingest</code> to build the " +
    "deterministic seed, then curate it.";
  banner.classList.remove("hidden");
} else if (SCAN.confidence !== "INFERRED") {
  banner.innerHTML =
    "<b>Deterministic seed.</b> Every feature is a <code>service</code> and every " +
    "flow an <code>entry</code> — nothing here knows what the code is <i>for</i> yet. " +
    "Run <code>/dummyindex</code> (Claude) or <code>$dummyindex</code> (Codex) to " +
    "author the curated scan.";
  banner.classList.remove("hidden");
}

/* ----- theme + keys ------------------------------------------------------- */

const root = document.documentElement;
const stored = (() => { try { return localStorage.getItem("dummyindex-scan-theme"); } catch { return null; } })();
if (stored) root.setAttribute("data-theme", stored);
document.getElementById("theme").addEventListener("click", () => {
  const dark = getComputedStyle(root).colorScheme !== "light";
  const next = dark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("dummyindex-scan-theme", next); } catch {}
});

/* Fit is the explicit way back to the whole map, so it also hands the
   viewport back to auto-fit. */
document.getElementById("fit").addEventListener("click", () => { userMoved = false; fit(); });

document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== search) { ev.preventDefault(); search.focus(); }
  else if (ev.key === "Escape") { search.value = ""; search.dispatchEvent(new Event("input")); search.blur(); select(null); }
  else if ((ev.key === "f" || ev.key === "F") && document.activeElement !== search) { userMoved = false; fit(); }
});

window.addEventListener("resize", () => { if (!userMoved) fit(); });

renderEmptyPanel();
fit();

/* ----- extras island: tiers 2 + 3 ---------------------------------------- */

const EXTRAS = (() => {
  try {
    return JSON.parse(document.getElementById("graph-extras").textContent) || {};
  } catch { return {}; }
})();
const COMMUNITIES = Array.isArray(EXTRAS.communities) ? EXTRAS.communities : [];
const COMMUNITY_LINKS = Array.isArray(EXTRAS.communityLinks) ? EXTRAS.communityLinks : [];
const EXPANSION =
  EXTRAS.expansion && typeof EXTRAS.expansion === "object" ? EXTRAS.expansion : {};

/* `evidence` is model-authored and lands in a class name; `relation` comes
   from the extraction and lands in the ghost's verb slot. Fold both onto
   closed alphabets before they touch markup — same discipline as safeKind. */
const EVIDENCE_SET = new Set(["EXTRACTED", "INFERRED"]);
const safeEvidence = e => (EVIDENCE_SET.has(e) ? e.toLowerCase() : null);
const RELATION_SET = new Set(["calls", "uses", "contains", "imports_from", "inherits", "method"]);
const safeRelation = r => (RELATION_SET.has(r) ? r.replace("_", " ") : "related");

/* EXTRACTED renders solid (the default border), INFERRED dashed. A scan
   without the field gets no class and renders exactly as before. */
nodeEls.forEach((el, id) => {
  const ev = safeEvidence(byId.get(id).evidence);
  if (ev) el.classList.add("ev-" + ev);
});

/* ----- tier 2: community overview ----------------------------------------- */

const COMM_W = 216, COMM_H = 46, COMM_GAP_X = 150, COMM_GAP_Y = 14;
const commBox = new Map();      // slug → {x, y, w, h}
const commEls = new Map();      // slug → element
const commWireEls = [];         // {link, path}
let commSize = { w: 0, h: 0 };
let commMode = false;
let commSelected = null;
const commSvg = document.createElementNS(SVGNS, "svg");
commSvg.id = "comm-wires";

/* Largest communities first — the overview is a weight map, not an index. */
function layoutCommunities() {
  const order = COMMUNITIES
    .filter(c => c && typeof c.slug === "string")
    .sort((a, b) => (Number(b.size) || 0) - (Number(a.size) || 0) ||
                    (a.slug < b.slug ? -1 : a.slug > b.slug ? 1 : 0));
  order.forEach((c, i) => {
    commBox.set(c.slug, {
      x: PAD + Math.floor(i / MAX_COL_ROWS) * (COMM_W + COMM_GAP_X),
      y: PAD + (i % MAX_COL_ROWS) * (COMM_H + COMM_GAP_Y),
      w: COMM_W, h: COMM_H,
    });
  });
  const boxes = [...commBox.values()];
  commSize = {
    w: Math.max(0, ...boxes.map(b => b.x + b.w)) + PAD,
    h: Math.max(0, ...boxes.map(b => b.y + b.h)) + PAD,
  };
  return order;
}

function renderCommunities() {
  const order = layoutCommunities();
  commSvg.setAttribute("width", commSize.w);
  commSvg.setAttribute("height", commSize.h);
  commSvg.setAttribute("viewBox", `0 0 ${commSize.w} ${commSize.h}`);
  canvas.appendChild(commSvg);

  for (const l of COMMUNITY_LINKS) {
    const a = commBox.get(l.from), b = commBox.get(l.to);
    if (!a || !b) continue;
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("class", "wire commwire");
    path.setAttribute("d", wirePath(a, b));
    /* Call volume → stroke weight. Coerced to a number before any math, so
       the only thing that ever reaches the style is arithmetic output. */
    const w = Math.max(1, Number(l.weight) || 1);
    path.style.strokeWidth = Math.min(5, 1 + Math.log2(1 + w)).toFixed(2) + "px";
    commSvg.appendChild(path);
    commWireEls.push({ link: l, path });
  }

  for (const c of order) {
    const b = commBox.get(c.slug);
    const el = document.createElement("div");
    el.className = "node commnode";
    el.style.cssText =
      `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;--kind:var(--k-service)`;
    const size = Number(c.size) || 0;
    el.innerHTML =
      '<span class="text">' +
      `<span class="label">${esc(c.slug)}</span>` +
      `<span class="sub">${esc(size + " symbols" + (c.feature ? " · " + c.feature : ""))}</span>` +
      "</span>";
    el.addEventListener("click", ev => { ev.stopPropagation(); selectCommunity(c.slug); });
    canvas.appendChild(el);
    commEls.set(c.slug, el);
  }
}
if (COMMUNITIES.length) renderCommunities();

function selectCommunity(slug) {
  commSelected = slug != null && commEls.has(slug) ? slug : null;
  commEls.forEach((el, s) => el.classList.toggle("selected", s === commSelected));
  commWireEls.forEach(w => {
    const hot = commSelected != null &&
      (w.link.from === commSelected || w.link.to === commSelected);
    w.path.classList.toggle("hot", hot);
    w.path.classList.toggle("dim", commSelected != null && !hot);
  });
  if (commSelected == null) {
    if (commMode) renderEmptyPanel();
    return;
  }
  const card = COMMUNITIES.find(c => c && c.slug === commSelected);
  if (card) renderCommunityPanel(card);
}

function renderCommunityPanel(c) {
  aside.classList.remove("empty-state");
  const members = Array.isArray(c.members) ? c.members : [];
  const rows = members.map(m => {
    const member = m && typeof m === "object" ? m : {};
    return '<li class="member"><span>' + esc(member.label) + "</span>" +
      (member.path ? '<code class="ref">' + esc(member.path) + "</code>" : "") +
      "</li>";
  }).join("");
  aside.innerHTML =
    '<div style="--kind:var(--k-service)">' +
    "<h2>" + esc(c.slug) + "</h2>" +
    '<div class="kindtag">community · ' + esc(Number(c.size) || members.length) +
      " symbols" + (c.feature ? " · " + esc(c.feature) : "") + "</div>" +
    (c.summary ? '<p class="detail-text">' + esc(c.summary) + "</p>" : "") +
    (rows ? "<h3>Top symbols</h3><ul>" + rows + "</ul>" : "") +
    "</div>";
}

const tiersBtn = document.getElementById("tiers");
/* No communities artifact → the toggle never appears and tier 2 stays off. */
if (COMMUNITIES.length) tiersBtn.classList.remove("hidden");

function setMode(on) {
  commMode = !!on && COMMUNITIES.length > 0;
  stage.classList.toggle("mode-communities", commMode);
  tiersBtn.textContent = commMode ? "Map" : "Communities";
  select(null);
  view.w = commMode ? commSize.w : size.w;
  view.h = commMode ? commSize.h : size.h;
  userMoved = false;
  fit();
}

tiersBtn.addEventListener("click", () => setMode(!commMode));
document.addEventListener("keydown", ev => {
  if ((ev.key === "c" || ev.key === "C") && document.activeElement !== search &&
      COMMUNITIES.length) setMode(!commMode);
});

/* ----- tier 3: focus + expand --------------------------------------------- */

const GHOST_W = 190, GHOST_H = 34, GHOST_GAP = 8, GHOST_DX = 44;
let ghostEls = [], ghostWires = [];

function collapseExpansion() {
  for (const el of ghostEls) el.remove();
  for (const p of ghostWires) p.remove();
  ghostEls = []; ghostWires = [];
}

function expansionFor(node) {
  if (!node || typeof node.symbolRef !== "string") return null;
  /* Guarded lookup: a symbolRef of `__proto__` must find nothing, not the
     prototype chain. */
  if (!Object.prototype.hasOwnProperty.call(EXPANSION, node.symbolRef)) return null;
  const entries = EXPANSION[node.symbolRef];
  return Array.isArray(entries) && entries.length ? entries : null;
}

/* Reveal the precomputed top-k symbol neighborhood beside the node. Ghosts
   are read-only annotations, so they take no pointer events and vanish the
   moment the selection moves on. */
function expandNode(id) {
  collapseExpansion();
  const n = byId.get(id), b = box.get(id);
  const entries = n && b ? expansionFor(n) : null;
  if (!entries) return;
  const x = b.x + b.w + GHOST_DX;
  let y = b.y + b.h / 2 - (entries.length * (GHOST_H + GHOST_GAP) - GHOST_GAP) / 2;
  for (const raw of entries) {
    const g = raw && typeof raw === "object" ? raw : {};
    const el = document.createElement("div");
    el.className = "ghost";
    el.style.cssText = `left:${x}px;top:${y}px;width:${GHOST_W}px;height:${GHOST_H}px`;
    el.innerHTML =
      `<span class="rel">${esc(safeRelation(g.relation))}${g.dir === "in" ? " ←" : " →"}</span>` +
      `<span class="gtext"><span class="glabel">${esc(g.label)}</span>` +
      (g.path ? `<span class="gpath">${esc(g.path)}</span>` : "") +
      "</span>";
    canvas.appendChild(el);
    ghostEls.push(el);
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("class", "wire ghostwire");
    p.setAttribute("d", wirePath(b, { x, y, w: GHOST_W, h: GHOST_H }));
    wires.appendChild(p);
    ghostWires.push(p);
    y += GHOST_H + GHOST_GAP;
  }
}

/* Selecting a curated node is what reveals its neighborhood, so expansion
   rides on `select` rather than adding a second gesture. The base binding
   is a function declaration, so rebinding the name wraps every caller —
   node clicks, panel jumps, Escape — without touching them. */
const baseSelect = select;
select = function (id) {
  baseSelect(id);
  selectCommunity(null);
  if (selected != null && !commMode) expandNode(selected);
  else collapseExpansion();
};
</script>
</body>
</html>
